<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  background: #050914;
  color: white;
  font-family: Arial, sans-serif;
}
canvas { display: block; }
#title {
  position: fixed;
  top: 25px;
  width: 100%;
  text-align: center;
  font-size: clamp(25px, 4vw, 48px);
  letter-spacing: 5px;
  text-shadow: 0 0 25px #49aaff;
  pointer-events: none;
}
#subtitle {
  margin-top: 9px;
  font-size: 15px;
  letter-spacing: 2px;
  color: #a9c9f7;
}
#legend {
  position: fixed;
  bottom: 25px;
  width: 100%;
  text-align: center;
  line-height: 2;
  font-size: clamp(12px, 1.6vw, 19px);
  color: #d8e7ff;
  pointer-events: none;
}
.proton { color: #ff626e; }
.neutron { color: #9eb2d0; }
.electron { color: #4bdcff; }
#hint {
  position: fixed;
  right: 18px;
  top: 18px;
  color: #8395b5;
  font-size: 12px;
}
</style>
</head>
<body>

<div id="title">
  URANIUM-235
  <div id="subtitle">THREE-DIMENSIONAL ATOMIC MODEL</div>
</div>

<div id="hint">Drag to rotate · Scroll to zoom · F11 fullscreen</div>

<div id="legend">
  <span class="proton">● 92 PROTONS</span>
  &nbsp;&nbsp;
  <span class="neutron">● 143 NEUTRONS</span>
  &nbsp;&nbsp;
  <span class="electron">● 92 ELECTRONS</span>
  <br>
  7 ELECTRON SHELLS · ATOMIC NUMBER 92 · MASS NUMBER 235
</div>

<script type="module">
import * as THREE from
  'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

import { OrbitControls } from
  'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050914);
scene.fog = new THREE.FogExp2(0x050914, 0.012);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(0, 7, 19);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.autoRotate = false;
controls.minDistance = 9;
controls.maxDistance = 35;

// Lighting
scene.add(new THREE.AmbientLight(0x9dbbff, 1.8));

const keyLight = new THREE.PointLight(0x66bbff, 100);
keyLight.position.set(5, 8, 10);
scene.add(keyLight);

const warmLight = new THREE.PointLight(0xffa0a0, 65);
warmLight.position.set(-7, -3, 5);
scene.add(warmLight);

// Main atom group
const atom = new THREE.Group();
scene.add(atom);

// Seven full spherical shell rings.
// Each ring is a great circle in a different 3D orientation.
const shellGroup = new THREE.Group();
atom.add(shellGroup);

const shellColors = [
  0x63cfff, 0x559cff, 0x7b8cff, 0x48c8d9,
  0x8e9fff, 0x56a9e8, 0x83d9ff
];

const shellRadii = [5.8, 5.8, 5.8, 5.8, 5.8, 5.8, 5.8];

const orientations = [
  [0, 0, 0],
  [Math.PI / 2, 0, 0],
  [0, Math.PI / 2, 0],
  [Math.PI / 3, Math.PI / 4, 0],
  [Math.PI / 4, Math.PI / 2, Math.PI / 3],
  [Math.PI / 2.5, Math.PI / 3, Math.PI / 2],
  [Math.PI / 3, Math.PI / 1.8, Math.PI / 4]
];

const shellCounts = [2, 8, 18, 32, 21, 9, 2];

const electronGeometry = new THREE.SphereGeometry(0.105, 12, 10);
const electronMaterial = new THREE.MeshStandardMaterial({
  color: 0x39dfff,
  emissive: 0x087ab0,
  emissiveIntensity: 2.2,
  metalness: 0.1,
  roughness: 0.25
});

const electronSystems = [];

for (let s = 0; s < 7; s++) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(shellRadii[s], 0.012, 8, 240),
    new THREE.MeshBasicMaterial({
      color: shellColors[s],
      transparent: true,
      opacity: 0.75
    })
  );

  ring.rotation.set(...orientations[s]);
  shellGroup.add(ring);

  const electronGroup = new THREE.Group();
  electronGroup.rotation.set(...orientations[s]);
  shellGroup.add(electronGroup);

  const electrons = [];
  for (let i = 0; i < shellCounts[s]; i++) {
    const e = new THREE.Mesh(electronGeometry, electronMaterial);
    electronGroup.add(e);
    electrons.push({
      mesh: e,
      angle: (i / shellCounts[s]) * Math.PI * 2,
      speed: (s % 2 === 0 ? 1 : -1) * (0.3 + s * 0.035)
    });
  }

  electronSystems.push({
    group: electronGroup,
    electrons,
    radius: shellRadii[s]
  });
}

// Central nucleus: 92 protons + 143 neutrons.
const nucleus = new THREE.Group();
atom.add(nucleus);

const protonMaterial = new THREE.MeshStandardMaterial({
  color: 0xff4354,
  emissive: 0x77101d,
  emissiveIntensity: 0.55,
  roughness: 0.32
});

const neutronMaterial = new THREE.MeshStandardMaterial({
  color: 0x7187a8,
  emissive: 0x17263c,
  emissiveIntensity: 0.35,
  roughness: 0.4
});

const nucleonGeometry = new THREE.SphereGeometry(0.24, 12, 10);

// Deterministic pseudo-random generator
let seed = 235;
function rand() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}

// Fill a compact sphere using a volume-uniform distribution.
for (let i = 0; i < 235; i++) {
  const z = rand() * 2 - 1;
  const theta = rand() * Math.PI * 2;
  const r = 1.25 * Math.cbrt(rand());
  const planar = Math.sqrt(1 - z * z);

  const particle = new THREE.Mesh(
    nucleonGeometry,
    i < 92 ? protonMaterial : neutronMaterial
  );

  particle.position.set(
    r * planar * Math.cos(theta),
    r * planar * Math.sin(theta),
    r * z
  );

  nucleus.add(particle);
}

// Subtle glowing nucleus core
const coreGlow = new THREE.Mesh(
  new THREE.SphereGeometry(1.35, 24, 18),
  new THREE.MeshBasicMaterial({
    color: 0xffad78,
    transparent: true,
    opacity: 0.06,
    side: THREE.BackSide
  })
);
nucleus.add(coreGlow);

// Background stars
const starPositions = [];
for (let i = 0; i < 900; i++) {
  starPositions.push(
    (rand() - 0.5) * 100,
    (rand() - 0.5) * 100,
    (rand() - 0.5) * 100
  );
}

const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(starPositions, 3)
);

const stars = new THREE.Points(
  starGeometry,
  new THREE.PointsMaterial({
    color: 0x91baff,
    size: 0.055,
    transparent: true,
    opacity: 0.65
  })
);
scene.add(stars);

// Animation
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Slowly rotate the complete 3D atom.
  atom.rotation.y = t * 0.12;
  atom.rotation.x = Math.sin(t * 0.15) * 0.12;

  // Electrons travel around each oriented shell.
  for (const system of electronSystems) {
    for (const e of system.electrons) {
      e.angle += e.speed * dt;

      e.mesh.position.set(
        Math.cos(e.angle) * system.radius,
        Math.sin(e.angle) * system.radius,
        0
      );
    }
  }

  nucleus.rotation.y = t * 0.08;
  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
